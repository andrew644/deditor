[package]
name = "deditor"
version = "0.1.0"
edition = "2024"

[dependencies]
glyphon = "0.12.0"
cosmic-text = "0.19"
ropey = "1.6.1"
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
bytemuck = { version = "1", features = ["derive"] }
nucleo-matcher = "0.3"
regex = "1"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(unix)'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "wgsl", "vulkan"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "wgsl", "dx12", "vulkan"] }
