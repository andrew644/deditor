# deditor configuration
# Copy to ~/.config/deditor/config.yaml and edit.
# All keys are optional; anything missing falls back to the default shown here.

font:
  family: MesloLGMDZ Nerd Font Mono
  size: 18.0

tab_width: 4
line_numbers: true
clipboard: true
show_whitespace: false
spellcheck: false
# Optional personal word list: one word per line, # starts a comment. Words here are
# accepted in addition to the built-in dictionary. Empty disables it.
spell_dict: ""
git_signs: true

theme:
  fg: "#c8d3f5"
  bg: "#222436"
  gutter_fg: "#545c7e"
  selection: "#2d3f76"
  cursorline: "#2f334d"
  tab_active: "#3b4261"
  tab_inactive: "#1e2030"
  status_bg: "#1e2030"
  accent: "#82aaff"
  error: "#ff757f"
  warn: "#ffc777"
  sign_add: "#c3e88d"
  sign_change: "#ffc777"
  sign_delete: "#ff757f"
  popup_bg: "#262a3f"
  popup_fg: "#c8d3f5"
  popup_sel: "#2d3f76"
